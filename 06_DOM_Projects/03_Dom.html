<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dom generate element</title>
</head>
<body>
   <!--Element get generated by javascript-->
</body>

<script>

function creatediv(){ const div=document.createElement('div')
 console.log(div);
 div.id=Math.round(Math.random()*10 +1)
 div.className='main'
 div.setAttribute('title','this is title')
 div.style.padding='8px';
 div.style.color='yellow'
 div.style.backgroundColor='gray'
 div.style.margin='2px'
 //div.innerText='This div created by javascript!'
 const addtext=document.createTextNode("This div created by javascript!")
 div.appendChild(addtext)
 document.body.appendChild(div)}

 creatediv()
 creatediv()


 
</script>
</html>
