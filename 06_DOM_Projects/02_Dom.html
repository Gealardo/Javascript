<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM | JAVASCRIPT</title>
</head>
<body style="background-color: gray;">
     <div class="parent">
       <div class="day">Monday</div>
       <div class="day">Tuesday</div>
       <div class="day">Wednesday</div>
       <div class="day">Thursday</div>
     </div>
</body>
<script>

  const parent = document.querySelector('.parent')
  console.log(parent);
  console.log(parent.children)
  console.log(parent.children[0])
  console.log(parent.children[0].innerText)
   console.log(parent.children[0].style.color='red')

   for(let i=0;i<parent.children.length;i++){
      console.log(parent.children[i].innerText);
   }
   

  console.log(parent.firstElementChild)
  console.log(parent.lastElementChild)

  const dayone= document.querySelector('.day')
  console.log(dayone);
  //do to the parrent and siblling
  console.log(dayone.parentElement)
  console.log(dayone.nextElementSibling)

  console.log("NODE" , parent.childNodes)// it count 1 for text when enter
   


</script>
</html>
