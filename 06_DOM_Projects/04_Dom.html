<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body style="background-color: black;">
     

      <ul class="language" style="color: white;">
        <li>javascript</li>

      </ul>
    
</body>
<script>

// adding of element
 function addLang(langname){
   const li= document.createElement('li');
   li.innerHTML=`${langname}`;
   document.querySelector('.language').appendChild(li);
 }
addLang("c++")
addLang("python")

 function addLangOpti(langname){
   const li= document.createElement('li');
   const text=document.createTextNode(langname)
   li.appendChild(text)
   document.querySelector('.language').appendChild(li);
 }
addLangOpti("php")
addLangOpti("java")

//Edit the Elements
const thirdlang=document.querySelector('li:nth-child(3)')
//console.log(thirdlang)
const newli=document.createElement('li')
const textnewli=document.createTextNode("new language")
newli.appendChild(textnewli)
thirdlang.replaceWith(newli)



</script>
</html>
